name: dialog_fork
display_name: 对话分叉
desc: 在同一聊天窗口内创建、跳转、重命名、列出和删除 LLM 对话分叉点。
help: |
  使用方法：
  /fork [分叉点名称] [注释] - 基于当前对话创建分叉点；不填名称时使用当前时间戳。
  /jump <分叉点名称> - 跳转到指定分叉点。
  /forkpoint-rename <旧分叉点名> <新分叉点名> - 重命名分叉点。
  /forkpoint-list - 列出当前聊天窗口中的分叉点。
  /forkpoint-remove <分叉点名称> - 删除指定分叉点；不能删除当前所在分叉点。
version: 0.1.0
author: Nartsam
astrbot_version: ">=4.23.1"
